# Focused uniform-versus-low-p-clustered FV grid study on one B200.

[solver]
solver_script = "adjoint_fv_solver.py"
device = "cuda:0"
B_T = 5.3
energy_diffusion = false

[domain]
e_parallel_min = 1.0
e_parallel_max = 1000.0
e_parallel_sampling = "log"
te_min_ev = 1.0
te_max_ev = 100.0
te_sampling = "log"
nD_min_m3 = 1.0e20
nD_max_m3 = 1.0e22
nD_sampling = "log"
nImp_min_m3 = 1.0e16
nImp_max_m3 = 1.0e22
nImp_sampling = "log"
zDavg_min = 0.01
zDavg_max = 1.0
zImpavg_min = 0.01
zImpavg_max = 10.0
impurity_name = "Ne"
impurity_Z = 10

[sampling]
seed = 1234
n_sobol = 0
include_center = true
include_axis_extrema = true
include_corners = false

[[panel]]
name = "uniform_fine"
Np = 1024
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "uniform"

[[panel]]
name = "uniform_reference"
Np = 512
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "uniform"

[[panel]]
name = "uniform_radial_coarse"
Np = 256
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "uniform"

[[panel]]
name = "uniform_pitch_coarse"
Np = 512
Nxi = 128
pmin = 0.001
pmax = 50.0
p_mapping = "uniform"

[[panel]]
name = "uniform_pitch_coarse_finep"
Np = 1024
Nxi = 128
pmin = 0.001
pmax = 50.0
p_mapping = "uniform"

[[panel]]
name = "low_p_clustered"
Np = 512
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "exponential"
p_mapping_kappa = 4.0

[[panel]]
name = "low_p_clustered_fine"
Np = 1024
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "exponential"
p_mapping_kappa = 4.0

[[panel]]
name = "low_p_clustered_k2"
Np = 512
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "exponential"
p_mapping_kappa = 2.0

[[panel]]
name = "low_p_clustered_k2_fine"
Np = 1024
Nxi = 256
pmin = 0.001
pmax = 50.0
p_mapping = "exponential"
p_mapping_kappa = 2.0

[comparison]
reference_panel = "uniform_fine"
Np = 256
Nxi = 128
# Keep probes inside the cell-center overlap of the uniform and clustered grids.
pmin = 0.2
pmax = 45.0

[output]
directory = "outputs/fv_grid_strategy"
save_fields = false
